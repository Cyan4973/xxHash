name: Release variants

# Attaches the limited variants of xxhash.h (make variants, see lib/README.md)
# to each published release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (v0.8.5 or later)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: variants-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate variants
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Generate and check variants
        run: |
          make variants
          make test-amalgamation
          ls -l variants

      - name: Preserve variants
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants-${{ steps.release.outputs.tag }}
          path: variants/*.h

  publish:
    name: Attach variants to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download variants
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: variants-${{ needs.build.outputs.tag }}
          path: dist

      - name: Attach variants to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in dist/*.h; do
            if printf '%s\n' "$existing" | grep -Fxq "${file#dist/}"; then
              echo "Release asset already exists: ${file#dist/}" >&2
              exit 1
            fi
          done
          gh release upload "$TAG" dist/*.h --repo "$GITHUB_REPOSITORY"
